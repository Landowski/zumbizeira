<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zumbizeira</title>
<link rel="stylesheet" href="game.css">
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" type="image/png" href="img/icone-192.png">
</head>
<body>

  <div id="rotate-device-overlay">
    <p>Gire o celular para horizontal 🔄</p>
  </div>

  <section id="lobby">
    <div class="left">
      <img src="img/logo-nome.png" style="width: 100%; height: auto;"/>
      <div class="jogadores" id="playerOptions">
        <div class="player-option selected" data-character="azul">
          <img src="img/j-0.png"/>
        </div>
        <div class="player-option" data-character="laranja">
          <img src="img/j-1.png"/>
        </div>
        <div class="player-option" data-character="amarelo">
          <img src="img/j-2.png"/>
        </div>
        <div class="player-option" data-character="rosa">
          <img src="img/j-3.png"/>
        </div>
        <div class="player-option" data-character="verde">
          <img src="img/j-4.png"/>
        </div>
        <div class="player-option" data-character="roxo">
          <img src="img/j-5.png"/>
        </div>
      </div>
      <input type="text" id="name" maxlength="15" autocomplete="off">
    </div>

    <div class="status">
      <p id="status">Conectando...</p>
      <p id="playerCount"></p>
      <div class="time hidden" id="time">
        <span>Minutos:</span>
        <div class="time-options" id="timeOptions">
          <div class="time-option" data-minutes="2">
            <span>2</span>
          </div>
          <div class="time-option" data-minutes="3">
            <span>3</span>
          </div>
          <div class="time-option" data-minutes="4">
            <span>4</span>
          </div>
          <div class="time-option" data-minutes="5">
            <span>5</span>
          </div>
        </div>
      </div>
      <button id="joinBtn" disabled>Entrar</button>
      <div class="menuBtns">
        <button id="startBtn" class="hidden">Iniciar</button>
        <button id="lobbyLeaveBtn" class="hidden">Sair</button>
      </div>
    </div>

  </section>
 
  <section id="game" class="hidden">
    <div id="hud" class="hidden">
      <span id="timer">--</span>
    </div>
    <div id="countdownOverlay" class="countdown-overlay hidden">
      <span id="countdownText" class="countdown-text"></span>
    </div>
    <canvas id="canvas" width="1376" height="768"></canvas>
 
    <div id="joystickZone">
      <div id="joystickThumb"></div>
    </div>
    <button id="sprintBtn"><img src="img/item-corrida.png" width="auto" height="30"/></button>
    <button id="actionBtn" class="hidden"><img src="img/item-lampada.png" width="auto" height="30"/></button>
 
    <div id="gameOver" class="hidden">
      <p id="gameOverText"></p>
      <button id="restartBtn" class="hidden">Reiniciar</button>
      <button id="leaveBtn">Sair da sala</button>
    </div>
  </section>

  <script src="firebase-app-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="peerjs.js"></script>
  <script src="config.js"></script>
  <script src="rooms-data.js"></script>
  <script src="sprites-data.js"></script>
  <script src="audio.js"></script>
  <script src="network.js"></script>
  <script src="game.js"></script>
  
</body>
</html>
